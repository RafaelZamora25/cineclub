<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club de Cine — Votación: Oscar Mejor Película Extranjera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --border: #2a2a2a;
    --gold: #c9a84c;
    --gold-dim: #8a6e2f;
    --text: #e8e4dc;
    --muted: #7a7570;
    --accent: #e63f2a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Lato', sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
    opacity: 0.5;
  }

  header {
    padding: 4rem 2rem 2rem;
    text-align: center;
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  header::after {
    content: '';
    display: block;
    width: 60px;
    height: 2px;
    background: var(--gold);
    margin: 1.5rem auto 0;
  }

  .club-label {
    font-family: 'Lato', sans-serif;
    font-weight: 400;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    font-size: 0.7rem;
    color: var(--gold);
    margin-bottom: 1rem;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }

  header p {
    color: var(--muted);
    margin-top: 1rem;
    font-size: 0.9rem;
    letter-spacing: 0.05em;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 2rem;
    max-width: 1400px;
    margin: 0 auto;
    padding: 3rem 1.5rem;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: border-color 0.3s ease, transform 0.3s ease;
    animation: fadeUp 0.6s ease both;
  }

  .card:hover {
    border-color: var(--gold-dim);
    transform: translateY(-4px);
  }

  .card:nth-child(1) { animation-delay: 0.05s; }
  .card:nth-child(2) { animation-delay: 0.10s; }
  .card:nth-child(3) { animation-delay: 0.15s; }
  .card:nth-child(4) { animation-delay: 0.20s; }
  .card:nth-child(5) { animation-delay: 0.25s; }
  .card:nth-child(6) { animation-delay: 0.30s; }
  .card:nth-child(7) { animation-delay: 0.35s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .poster-wrap {
    position: relative;
    aspect-ratio: 2/3;
    overflow: hidden;
    background: #111;
  }

  .poster-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s ease, opacity 0.3s ease;
    opacity: 0;
  }

  .poster-wrap img.loaded {
    opacity: 1;
  }

  .card:hover .poster-wrap img {
    transform: scale(1.04);
  }

  .poster-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 2rem;
  }

  .year-badge {
    position: absolute;
    top: 0.75rem;
    right: 0.75rem;
    background: rgba(0,0,0,0.75);
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    padding: 0.25rem 0.5rem;
    font-family: 'Lato', sans-serif;
    font-weight: 400;
  }


  .card-body {
    padding: 1.4rem 1.4rem 1rem;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .card-meta {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.5rem;
  }

  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 0.8rem;
  }

  .card-synopsis {
    font-size: 0.85rem;
    line-height: 1.75;
    color: #b0aba3;
    flex: 1;
  }

  .card-footer {
    padding: 1rem 1.4rem 1.4rem;
    border-top: 1px solid var(--border);
    margin-top: 1rem;
  }

  .fa-link {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gold);
    text-decoration: none;
    transition: color 0.2s;
  }

  .fa-link:hover {
    color: var(--text);
  }

  .fa-link svg {
    width: 12px;
    height: 12px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  footer {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--muted);
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    border-top: 1px solid var(--border);
  }

  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; padding: 1.5rem 1rem; gap: 1.5rem; }
  }
</style>
</head>
<body>

<header>
  <div class="club-label">Club de Cine</div>
  <h1>Nominadas al Oscar<br>Mejor Película Internacional</h1>
  <p>Selecciones del club · 2000 en adelante · Votá tu favorita en el grupo de WhatsApp</p>
</header>

<div class="grid" id="grid"></div>

<footer>filmaffinity.com &mdash; Sinopsis de referencia</footer>

<script>
const films = [
  {
    title: "Crouching Tiger, Hidden Dragon",
    original: "Wo hu cang long",
    director: "Ang Lee",
    year: 2000,
    country: "Taiwán",
    poster: "https://pics.filmaffinity.com/wo_hu_cang_long_crouching_tiger_hidden_dragon-609972600-large.jpg",
    synopsis: "Dos maestros guerreros emprenden la búsqueda de una espada legendaria robada, mientras una joven aristócrata oculta un talento marcial excepcional y un pasado de amor prohibido. Ang Lee firma un wuxia de vuelos imposibles sobre los tejados y una épica romántica ambientada en la China del siglo XIX.",
    url: "https://www.filmaffinity.com/es/film488497.html"
  },
  {
    title: "Sin novedad en el frente",
    original: "Im Westen nichts Neues",
    director: "Edward Berger",
    year: 2022,
    country: "Alemania",
    poster: "https://pics.filmaffinity.com/im_westen_nichts_neues-582072472-large.jpg",
    synopsis: "Un joven alemán se alista con entusiasmo patriótico en la Primera Guerra Mundial junto a sus amigos, y ve cómo ese fervor se derrumba ante el horror de las trincheras. Nueva adaptación de la novela de Erich Maria Remarque, tan brutal como visualmente arrolladora.",
    url: "https://www.filmaffinity.com/es/film621534.html"
  },
  {
    title: "El abrazo de la serpiente",
    original: "El abrazo de la serpiente",
    director: "Ciro Guerra",
    year: 2015,
    country: "Colombia",
    poster: "https://pics.filmaffinity.com/el_abrazo_de_la_serpiente-385873306-large.jpg",
    synopsis: "Karamakate, último chamán de su pueblo, guía durante cuatro décadas a dos científicos occidentales en su búsqueda de una planta sagrada en el Amazonas. Rodada en un blanco y negro hipnótico, es un viaje sobre la memoria, el colonialismo y el saber ancestral.",
    url: "https://www.filmaffinity.com/es/film917148.html"
  },
  {
    title: "El agente secreto",
    original: "O Agente Secreto",
    director: "Kleber Mendonça Filho",
    year: 2025,
    country: "Brasil",
    poster: "https://pics.filmaffinity.com/o_agente_secreto-885329777-large.jpg",
    synopsis: "Brasil, 1977. En plena dictadura militar, Marcelo huye de un pasado turbulento y llega a Recife buscando rehacer su vida y reencontrarse con su hijo, pero pronto descubre que las fuerzas del régimen le pisan los talones. Thriller político que arrasó en Cannes 2025.",
    url: "https://www.filmaffinity.com/es/film457500.html"
  },
  {
    title: "La vida de los otros",
    original: "Das Leben der Anderen",
    director: "Florian Henckel von Donnersmarck",
    year: 2006,
    country: "Alemania",
    poster: "https://pics.filmaffinity.com/das_leben_der_anderen-834646055-large.jpg",
    synopsis: "Berlín Este, 1984. Un frío oficial de la Stasi es encargado de vigilar a un escritor y a su pareja, actriz, y termina descubriendo en esa vigilancia algo que no esperaba: su propia humanidad. Un thriller sobre la vida bajo un régimen totalitario, ganador del Oscar.",
    url: "https://www.filmaffinity.com/es/film381846.html"
  },
  {
    title: "Despedidas",
    original: "Okuribito (Departures)",
    director: "Yōjirō Takita",
    year: 2008,
    country: "Japón",
    poster: "https://pics.filmaffinity.com/okuribito_departures-684861181-large.jpg",
    synopsis: "Un violonchelista que se queda sin trabajo regresa a su pueblo natal y, casi por accidente, empieza a trabajar preparando a los muertos para su último viaje. Una película delicada sobre el duelo, el estigma y la dignidad de despedirse.",
    url: "https://www.filmaffinity.com/es/film892791.html"
  },
  {
    title: "Argentina, 1985",
    original: "Argentina, 1985",
    director: "Santiago Mitre",
    year: 2022,
    country: "Argentina",
    poster: "https://pics.filmaffinity.com/argentina_1985-430372554-large.jpg",
    synopsis: "La historia real del fiscal Julio Strassera y su joven equipo, que en plena democracia recién recuperada se atrevieron a juzgar a la cúpula de la dictadura militar argentina, bajo amenazas constantes. Con Ricardo Darín en el papel de su vida.",
    url: "https://www.filmaffinity.com/es/film117089.html"
  }
];

const grid = document.getElementById('grid');

films.forEach(film => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="poster-wrap">
      <div class="poster-placeholder">🎞</div>
      <img src="${film.poster}" alt="Afiche de ${film.title}" loading="lazy">
      <span class="year-badge">${film.year}</span>
    </div>
    <div class="card-body">
      <div class="card-meta">${film.director} &middot; ${film.country}</div>
      <h2 class="card-title">${film.title}</h2>
      <p class="card-synopsis">${film.synopsis}</p>
    </div>
    <div class="card-footer">
      <a class="fa-link" href="${film.url}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>
        Ver en FilmAffinity
      </a>
    </div>
  `;

  const img = card.querySelector('img');
  img.onload = () => img.classList.add('loaded');
  img.onerror = () => {
    img.style.display = 'none';
  };

  grid.appendChild(card);
});
</script>
</body>
</html>
